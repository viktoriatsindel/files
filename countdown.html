<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wedding Countdown</title>
  <style>
    html,body{ margin:0; padding:0; background:transparent; }
    .wrap{
      position:relative;
      width:100%;
      overflow:hidden;
      font-family:"Times New Roman", Times, serif;
      color:#f9efe1;
    }
    .bg{
      display:block;
      width:100%;
      height:auto;
    }
    .overlay{
      position:absolute;
      left:50%;
      top:0;
      transform:translateX(-50%);
      width:100%;
      text-align:center;
      padding-top:0px; /* максимально вверх */
      pointer-events:none;
    }
    .grid{
      display:inline-flex;
      gap:14px;
      align-items:flex-end;
      justify-content:center;
      padding:0 14px;
    }
    .item{ min-width:56px; }
    .num{ font-weight:700; font-size:30px; line-height:1; }
    .lbl{ margin-top:6px; font-weight:700; font-size:12px; line-height:1; opacity:.95; }
    @media (max-width:360px){
      .grid{ gap:10px; }
      .num{ font-size:26px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="wcd">
    <img class="bg"
      src="https://raw.githubusercontent.com/viktoriatsindel/files/db4f3b9e882a84e4bcb4bf9eb581b787860a9a00/%D0%BF%D1%80%D0%B8%D0%B3%D0%BB%D0%B0%D1%88%D0%B5%D0%BD%D0%B8%D0%B5-%D0%90%D0%BB%D0%B8%D0%BD%D0%B0-%D0%B8-%D0%94%D0%B8%D0%BC%D0%B0-%D0%B2%D0%B0%D1%80-2_05.png"
      alt=""
    />
    <div class="overlay">
      <div class="grid" role="timer" aria-live="polite">
        <div class="item"><div class="num" data-unit="days">0</div><div class="lbl">дней</div></div>
        <div class="item"><div class="num" data-unit="hours">00</div><div class="lbl">часов</div></div>
        <div class="item"><div class="num" data-unit="mins">00</div><div class="lbl">минут</div></div>
        <div class="item"><div class="num" data-unit="secs">00</div><div class="lbl">секунд</div></div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const root = document.getElementById('wcd');
      const elDays  = root.querySelector('[data-unit="days"]');
      const elHours = root.querySelector('[data-unit="hours"]');
      const elMins  = root.querySelector('[data-unit="mins"]');
      const elSecs  = root.querySelector('[data-unit="secs"]');

      // 12.06.2026 16:00 MSK (UTC+3) = 13:00 UTC
      const targetUtcMs = Date.UTC(2026, 5, 12, 13, 0, 0);
      const pad2 = (n)=>String(n).padStart(2,'0');

      function tick(){
        let diff = targetUtcMs - Date.now();
        if(diff <= 0){
          elDays.textContent='0'; elHours.textContent='00'; elMins.textContent='00'; elSecs.textContent='00';
          return;
        }
        const sec=1000, min=60*sec, hr=60*min, day=24*hr;
        const days=Math.floor(diff/day); diff-=days*day;
        const hours=Math.floor(diff/hr); diff-=hours*hr;
        const mins=Math.floor(diff/min); diff-=mins*min;
        const secs=Math.floor(diff/sec);

        elDays.textContent=String(days);
        elHours.textContent=pad2(hours);
        elMins.textContent=pad2(mins);
        elSecs.textContent=pad2(secs);
      }
      tick();
      setInterval(tick,1000);
    })();
  </script>
</body>
</html>
